[package]
name = "wind_send"
version = "1.7.3"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
disable-systray-support = []


[dependencies]
# tray-item = "0.8.0"
log = "0.4.34"
aes = "0.9.3"
hex = "0.4.3"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
rand = "0.10.2"
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
pbkdf2 = "0.13"
image = "0.25"
crossbeam-channel = "0.5.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.33"
# 依赖ring v0.16.20导致aarch64-windows编译失败
# x509-parser升级到0.16.0即可解决
rcgen = { version = "0.14.10", features = ["pem"] }
pem = { version = "4.0.0" }
time = { version = "0.3.55", features = ["macros", "local-offset"] }
lazy_static = "1.4"
home = "0.5"
encoding = "0.2.33"
tracing = "0.1"
backtrace = "0.3"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "time",
    "local-time",
] }
tracing-appender = "0.2"
sha2 = "0.11"
anyhow = "1.0.104"
cbc = "0.2"
cipher = "0.5"
chrono = "0.4"
subslice = "0.2.3"
regex = "1.13.1"
arboard = { version = "3.6", features = [
    "core-graphics",
    "image",
    "image-data",
    "wayland-data-control",
    "wl-clipboard-rs",
] }
# notify-rust = { git = "https://github.com/doraemonkeys/notify-rust", branch = "main" }
# tokio-native-tls = "0.3.1"
rustls-pemfile = "2.2"
# https://aws.github.io/aws-lc-rs/requirements/windows.html
# tokio-rustls = { git = "https://github.com/doraemonkeys/tokio-rustls.git", branch = "ignore_invalid_SNI_0.25.0" }
tokio-rustls = "0.26.5"
hostname = "0.4"
walkdir = "2.4"
socket2 = { features = ["all"], version = "0.6.5" }
clipboard-rs = "0.3.5"
dirs = "7.0.0"
base64 = "0.23.1"
aes-gcm = "0.11.1"
thiserror = "2.0.20"
unicode-normalization = "0.1"


# rustls = { version = "0.21.7", features = ["dangerous_configuration"] }
# rustls = { path = "Downloads/rustls-main/rustls/rustls", features = [
#     "ring",
# ] }
# pki-types = { package = "rustls-pki-types", version = "0.2.1", features = [
#     "std",
# ] }
# rustls = { path = "./rustls/rustls" }
# tokio-rustls = { path = "./tokio-rustls" }


# windows dependencies
[target.'cfg(target_os = "linux")'.dependencies]
urlencoding = "2.1.3"

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }

[target.'cfg(not(all(target_os = "linux", target_env = "musl")))'.dependencies]
tao = "0.37.0"
tray-icon = "0.25.1"
reqwest = { version = "0.13.5", features = ["multipart", "cookies"] }
# rfd 0.14.0 在ubuntu上编译失败
rfd = "0.17"

# windows dependencies
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
win-toast-notify = "0.1.6"

[target.'cfg(not(target_os = "windows"))'.dependencies]
# notify-rust4.10依赖zbus_names v2.6.0导致ubuntu编译失败
notify-rust = "4.18.0"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30.13"
objc = "0.2.7"

[build-dependencies]
windres = "*"


[dev-dependencies]
tao = "0.37.0"
